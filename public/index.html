<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minecraft Control</title><style>body{font:16px system-ui;background:#10141d;color:#e8eef8;max-width:900px;margin:28px auto;padding:0 18px}main{background:#181f2b;border:1px solid #2b384c;border-radius:16px;padding:24px}input,button{font:inherit;border-radius:9px;padding:10px 13px;border:1px solid #40516b;background:#111722;color:#fff}button{cursor:pointer;background:#2867d8;border:0;margin:4px}.danger{background:#a84343}.muted{color:#98a8be}.tabs{margin:18px 0 8px;border-bottom:1px solid #334258;padding-bottom:8px}pre{background:#0b0f16;padding:14px;border-radius:10px;white-space:pre-wrap;min-height:100px;max-height:480px;overflow:auto}.card{background:#202a39;border-radius:12px;padding:14px;margin:10px 0}</style></head><body><main><h1>Minecraft Control</h1><p class="muted" id="mode">Панель управления сервером</p><section id="login"><input id="pw" type="password" placeholder="Пароль админ-панели"><button onclick="login()">Войти</button></section><section id="public" hidden><div class="card"><b>Сервер выключен?</b><p class="muted">Эта страница может только запустить его.</p><button onclick="startPublic()">Запустить сервер</button></div></section><section id="admin" hidden><div class="tabs"><button onclick="status()">Статус</button><button onclick="load('players')">Игроки</button><button onclick="load('plugins')">Плагины</button><button onclick="load('worlds')">Миры/диск</button><button onclick="load('logs')">Логи</button></div><p><button onclick="action('start')">Запустить</button><button onclick="action('restart')">Перезапустить</button><button class="danger" onclick="action('stop')">Остановить</button><button onclick="logout()">Выйти</button></p><div class="card"><b>Безопасные команды</b><input id="cmd" placeholder="list, tps, save-all, say ..."><button onclick="command()">Отправить</button></div><pre id="out">Выберите раздел.</pre></section></main><script>const $=x=>document.getElementById(x);async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);return j}async function boot(){try{let h=await api('/healthz');if(h.mode==='public-launcher'){$('login').hidden=true;$('public').hidden=false;$('mode').textContent='Публичный запуск без доступа к админским функциям'}}catch(e){}}async function login(){try{await api('/api/login',{method:'POST',body:JSON.stringify({password:$('pw').value})});$('login').hidden=true;$('admin').hidden=false;status()}catch(e){$('out').textContent=e.message}}async function status(){try{$('out').textContent=(await api('/api/status')).output}catch(e){$('out').textContent=e.message}}async function load(x){try{$('out').textContent=(await api('/api/'+x)).output}catch(e){$('out').textContent=e.message}}async function action(a){$('out').textContent='Выполняется…';try{$('out').textContent=(await api('/api/server/'+a,{method:'POST'})).output||'Команда выполнена';setTimeout(status,1200)}catch(e){$('out').textContent=e.message}}async function command(){try{$('out').textContent=(await api('/api/command',{method:'POST',body:JSON.stringify({command:$('cmd').value})})).output||'Отправлено'}catch(e){$('out').textContent=e.message}}async function startPublic(){try{$('public').querySelector('button').disabled=true;$('mode').textContent=(await api('/api/public/start',{method:'POST'})).output||'Сервер запускается'}catch(e){$('mode').textContent=e.message}}async function logout(){await api('/api/logout',{method:'POST'});location.reload()}boot()</script></body></html>
