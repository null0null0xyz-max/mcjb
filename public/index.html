<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minecraft Control</title><style>body{font:16px system-ui;background:#10141d;color:#e8eef8;max-width:760px;margin:40px auto;padding:0 18px}main{background:#181f2b;border:1px solid #2b384c;border-radius:16px;padding:24px}input,button{font:inherit;border-radius:9px;padding:11px 14px;border:1px solid #40516b;background:#111722;color:#fff}button{cursor:pointer;background:#2867d8;border:0;margin:5px 4px 5px 0}button.warn{background:#a84343}pre{background:#0b0f16;padding:14px;border-radius:10px;white-space:pre-wrap;min-height:80px}.muted{color:#98a8be}</style></head><body><main><h1>Minecraft Control</h1><p class="muted">Управление Paper-сервером через защищённое SSH-соединение.</p><section id="login"><input id="pw" type="password" placeholder="Пароль панели"><button onclick="login()">Войти</button></section><section id="app" hidden><p><button onclick="status()">Обновить статус</button><button onclick="action('start')">Запустить</button><button onclick="action('restart')">Перезапустить</button><button class="warn" onclick="action('stop')">Остановить</button><button onclick="logout()">Выйти</button></p><pre id="out">Нажмите «Обновить статус».</pre></section></main><script>const $=id=>document.getElementById(id);async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||r.status);return j}async function login(){try{await api('/api/login',{method:'POST',body:JSON.stringify({password:$('pw').value})});$('login').hidden=true;$('app').hidden=false;status()}catch(e){$('out').textContent=e.message}}async function status(){try{$('out').textContent=(await api('/api/status')).output}catch(e){$('out').textContent=e.message}}async function action(a){$('out').textContent='Выполняется…';try{$('out').textContent=(await api('/api/server/'+a,{method:'POST'})).output||'Готово';setTimeout(status,1500)}catch(e){$('out').textContent=e.message}}async function logout(){await api('/api/logout',{method:'POST'});location.reload()}</script></body></html>
